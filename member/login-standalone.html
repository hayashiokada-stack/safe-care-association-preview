<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>로그인 | 한국안전돌봄협회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#1b3a6b;--accent:#1a8a7a;--bg:#f4f7fb;--text:#1a2332;--muted:#5a6a7e;--border:#dde3ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.panel{width:100%;max-width:480px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(27,58,107,.12)}
.brand{text-align:center;margin-bottom:28px}
.logo{width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff;font-weight:900;font-size:1.3rem}
h1{font-size:1.25rem;font-weight:800;color:var(--primary)}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.form-group{margin-bottom:18px}
input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.92rem;font-family:inherit;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;border:0;border-radius:10px;padding:15px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
.btn:disabled{opacity:.65;cursor:wait}
.msg{display:none;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:.86rem}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:.85rem}
.links a{color:var(--accent);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main class="wrap">
<form id="loginForm" class="panel">
<div class="brand"><div class="logo">안</div><h1>한국안전돌봄협회</h1></div>
<div class="form-group"><label for="loginEmail">이메일</label><input id="loginEmail" type="email" autocomplete="email" required></div>
<div class="form-group"><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
<div id="loginMessage" class="msg"></div>
<button id="loginSubmitBtn" type="submit" class="btn">로그인</button>
<div class="links"><a href="/">홈으로</a><a href="/member/mypage.html">마이페이지</a></div>
</form>
</main>
<script type="module">
import { getSupabaseClient } from "./supabase-config.js";

let supabase;
try{
  supabase=getSupabaseClient();
}catch(err){
  supabase=null;
}

const form=document.getElementById('loginForm');
const emailInput=document.getElementById('loginEmail');
const passwordInput=document.getElementById('loginPassword');
const btn=document.getElementById('loginSubmitBtn');
const msg=document.getElementById('loginMessage');

function showMessage(text,type='error'){
  msg.textContent=text;
  msg.style.display='block';
  msg.style.color=type==='success'?'#166534':'#dc2626';
  msg.style.background=type==='success'?'#e8f5f0':'#ffe8e8';
}

function loginTarget(){
  const params=new URLSearchParams(window.location.search);
  return params.get('redirect')||'/member/mypage.html';
}

const pageParams=new URLSearchParams(window.location.search);
if(pageParams.get('verified')){
  showMessage('가입 신청이 확인되었습니다. 로그인해 주세요.','success');
}else if(pageParams.get('verifyRequired')){
  showMessage('로그인 후 마이페이지를 이용할 수 있습니다.');
}

if(supabase){
  const {data:{session}}=await supabase.auth.getSession();
  if(session?.user){
    window.location.href=loginTarget();
  }
}

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  msg.style.display='none';
  btn.disabled=true;
  btn.textContent='로그인 중...';
  try{
    if(!supabase)throw new Error('supabase-not-configured');
    const {data,error}=await supabase.auth.signInWithPassword({
      email:emailInput.value.trim().toLowerCase(),
      password:passwordInput.value
    });
    if(error)throw error;
    await supabase.from('members').update({status:'approved'}).eq('id',data.user.id);
    showMessage('로그인되었습니다.','success');
    window.location.href=loginTarget();
  }catch(err){
    const errorText=(err?.message||'').toLowerCase();
    let message='로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.';
    if(err?.message==='supabase-not-configured')message='Supabase 연결 정보가 아직 입력되지 않았습니다. member/supabase-config.js를 먼저 설정해 주세요.';
    else if(errorText.includes('email not confirmed'))message='Supabase에서 이메일 인증 설정이 켜져 있습니다. Authentication > Sign In / Providers > Email에서 Confirm email을 끈 뒤 다시 로그인해 주세요.';
    else if(errorText.includes('invalid login'))message='이메일 또는 비밀번호가 올바르지 않습니다.';
    else if(errorText.includes('invalid email'))message='이메일 형식이 올바르지 않습니다.';
    else if(errorText.includes('rate limit')||errorText.includes('too many'))message='로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.';
    showMessage(message);
  }finally{
    btn.disabled=false;
    btn.textContent='로그인';
  }
});
</script>
</body>
</html>

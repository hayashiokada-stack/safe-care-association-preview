<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>페이지 이동 중 | 한국안전돌봄협회</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#1a2332}
.box{max-width:520px;background:#fff;border:1px solid #dde3ee;border-radius:18px;padding:32px;text-align:center;box-shadow:0 16px 48px rgba(27,58,107,.10)}
a{color:#1a8a7a;font-weight:700}
</style>
</head>
<body>
<div class="box">
<h1>페이지를 찾을 수 없습니다</h1>
<p>주소를 확인하거나 홈으로 이동해 주세요.</p>
<p><a href="/">홈으로 이동</a></p>
</div>
<script>
(function(){
  const url=new URL(location.href);
  const path=decodeURIComponent(url.pathname);
  if(path.includes('member login')||path.includes('로그인')){
    const next=new URL('//member/login-standalone.html',location.origin);
    if(url.searchParams.get('verified'))next.searchParams.set('verified','1');
    if(url.searchParams.get('verifyRequired'))next.searchParams.set('verifyRequired','1');
    location.replace(next.href);
  }
})();
</script>
</body>
</html>
